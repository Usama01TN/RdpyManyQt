[build-system]
# The Cython decoders use typed memoryviews only (no NumPy C API): NumPy is a runtime
# dependency, not a build one, so iOS / Android cross builds need no NumPy for the target.
# setuptools >= 77: SPDX license expression + license-files (PEP 639), built-in bdist_wheel.
requires = ["setuptools>=77", "Cython>=3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rdpymanyqt"
version = "3.1.3"
description = "RdpyManyQt: pure-Python Remote Desktop (RDP) client for every Qt binding (fork of rdpyqt)"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [
    { name = "Sylvain Peyrefitte", email = "citronneur@gmail.com" },
    { name = "Hajime Nakagami", email = "nakagami@gmail.com" },
    { name = "UsamaTN", email = "ininou.oussematn@gmail.com" },
]
maintainers = [
    { name = "UsamaTN", email = "ininou.oussematn@gmail.com" },
]
dependencies = [
    "twisted",
    "pyopenssl",
    "service_identity",
    "rsa",
    "pyasn1",
    "pycryptodome",
    "Pillow",
    "ManyQt",
    "qt-reactor",
    "numpy",
    # cryptography >= 49 publishes no Intel macOS wheels: without this pip downloads the
    # source archive and needs Rust + OpenSSL. 48.x is the last release with a universal2
    # wheel (pip then picks a pyOpenSSL that accepts it).
    "cryptography<49; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[project.urls]
homepage = "https://github.com/Usama01TN/RdpyManyQt"
upstream = "https://github.com/nakagami/rdpyqt"

[project.optional-dependencies]
h264 = ["av"]

[project.scripts]
rdpyqt = "rdpy.scripts.rdpyqt:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["rdpy*"]

[tool.setuptools.package-data]
"rdpy.ui.rdpviewer.images" = ["*.png"]

# Binary wheels for every platform: see .github/workflows/build-release.yml
[tool.cibuildwheel]
# every CPython release that cibuildwheel supports and requires-python accepts:
# 3.11 - 3.15 with cibuildwheel 4.3 (iOS / Android: 3.13 - 3.15, the first with official
# mobile support)
build = ["cp*"]
skip = [
    "*t-*",               # free-threaded builds: the decoders rely on the GIL
    "*-manylinux_i686",   # no NumPy / cryptography wheels for 32-bit Linux:
    "*-musllinux_i686",   #   the wheel could not be installed without compilers
]
build-frontend = "build"
test-command = "python {project}/tools/check_wheel.py"
# recent cryptography releases ship no wheels for Intel macOS, 32-bit Windows (>= 49) or
# Windows ARM64 (> 46.0.3): install the newest release that has a wheel instead of
# compiling it (Rust + OpenSSL); pip then picks a pyOpenSSL / service-identity that accept it
test-environment = { PIP_ONLY_BINARY = "cryptography" }
# mobile wheels can not run on the build machine (and NumPy / cryptography publish no
# iOS / Android wheels to test them with)
test-skip = ["*-android_*", "*-ios_*"]

[tool.cibuildwheel.linux]
archs = ["native"]
# pip's retry settings from the CI job, into the build containers (ignored when unset)
environment-pass = ["PIP_RETRIES", "PIP_DEFAULT_TIMEOUT"]

[tool.cibuildwheel.macos]
# one runner builds both Intel and Apple Silicon wheels (Intel ones are tested under Rosetta)
archs = ["x86_64", "arm64"]
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }

[tool.cibuildwheel.windows]
# "auto": the x64 runner builds and tests AMD64 + 32-bit x86 wheels, the ARM64 runner ARM64
archs = ["auto"]

[tool.cibuildwheel.ios]
archs = ["arm64_iphoneos", "arm64_iphonesimulator", "x86_64_iphonesimulator"]
# the build needs no external tool (no cmake / ninja / rustc): only a C compiler and Cython
xbuild-tools = []

[tool.cibuildwheel.android]
archs = ["arm64_v8a", "x86_64"]
