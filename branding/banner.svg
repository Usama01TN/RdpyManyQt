<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400">
    <defs>
        <linearGradient id="bbg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#14213D"/>
            <stop offset="1" stop-color="#0A0F1E"/>
        </linearGradient>
        <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#2FD6A8"/>
            <stop offset="1" stop-color="#1E8FE0"/>
        </linearGradient>
        <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
