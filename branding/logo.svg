<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#1B2A4A"/>
            <stop offset="1" stop-color="#0E1628"/>
        </linearGradient>
        <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#2FD6A8"/>
            <stop offset="1" stop-color="#1E8FE0"/>
        </linearGradient>
        <linearGradient id="link" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#FFD24A"/>
            <stop offset="1" stop-color="#FF8A3D"/>
        </linearGradient>
    </defs>
    <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)"/>
    <!-- remote screen -->
    <rect x="44" y="52" width="168" height="112" rx="14" fill="url(#screen)"/>
    <rect x="56" y="64" width="144" height="88" rx="8" fill="#0E1628" opacity="0.88"/>
    <!-- stand -->
    <path d="M112 164 L144 164 L150 186 L106 186 Z" fill="#2FD6A8" opacity="0.9"/>
    <rect x="88" y="186" width="80" height="10" rx="5" fill="#2FD6A8"/>
    <!-- "R" glyph drawn with paths -->
    <path d="M82 138 L82 80 L110 80 C124 80 132 88 132 99 C132 109 126 116 116 118 L134 138 L119 138 L103 119 L95 119 L95 138 Z
           M95 91 L95 108 L109 108 C115 108 119 105 119 99.5 C119 94 115 91 109 91 Z" fill="#FFFFFF"/>
    <!-- connection waves -->
    <path d="M150 122 a16 16 0 0 1 16 -16" fill="none" stroke="url(#link)" stroke-width="8" stroke-linecap="round"/>
    <path d="M150 140 a34 34 0 0 1 34 -34" fill="none" stroke="url(#link)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="150" cy="138" r="7" fill="#FFD24A"/>
</svg>
