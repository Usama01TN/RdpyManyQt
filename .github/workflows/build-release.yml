# RdpyManyQt - build wheels for every platform and publish the GitHub release v<version>
#
# Copyright (c) 2026 UsamaTN <ininou.oussematn@gmail.com>
# SPDX-License-Identifier: GPL-3.0-or-later
#
# Triggers
#   push (main / master)  : build every platform, then publish the release "v<version>"
#   tag v<version>        : same (python tools/build.py release)
#   manual run            : "Run workflow" builds and publishes from the selected branch
#                           (untick "release" to only build)
#   pull request          : build and test only (a pull request never publishes)
#
# The release is never skipped on a push: it publishes whatever was built, even when a
# platform failed (that job still turns the run red). The tag v<version> is force-moved to
# the built commit and the release assets are replaced, so pushing again without bumping
# the version in pyproject.toml republishes the same version. (This needs the repository's
# "immutable releases" setting off: an immutable release can not be updated.)
#
# Output: binary wheels (compiled decoders) for
#   Windows x86-64 / x86 / ARM64, Linux x86-64 / ARM64 (manylinux + musllinux),
#   macOS Intel / Apple Silicon, iOS (device + simulators), Android (arm64-v8a, x86-64)
# for CPython 3.11 - 3.15 (iOS / Android: 3.13 - 3.15, the first with official mobile
# support), plus a pure-Python wheel that installs anywhere and the source archive.

name: build-release

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish (force-update) the GitHub release v<version> (version from pyproject.toml)"
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # only superseded pull request runs are cancelled: a push run always reaches its release
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  version:
    name: Read version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Version from pyproject.toml
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "RdpyManyQt version $VERSION"
      - name: Tag must match the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ "${GITHUB_REF_NAME}" != "v${{ steps.v.outputs.version }}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match pyproject.toml version v${{ steps.v.outputs.version }}"
            exit 1
          fi

  wheels:
    name: Wheels ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # architectures and Python versions: [tool.cibuildwheel] in pyproject.toml
        include:
          - { name: linux-x86_64,      os: ubuntu-latest,    platform: linux }    # manylinux + musllinux
          - { name: linux-aarch64,     os: ubuntu-24.04-arm, platform: linux }    # manylinux + musllinux
          - { name: windows-amd64-x86, os: windows-latest,   platform: windows }  # 64-bit + 32-bit
          - { name: windows-arm64,     os: windows-11-arm,   platform: windows }
          - { name: macos,             os: macos-latest,     platform: macos }    # x86_64 + arm64
          - { name: ios,               os: macos-latest,     platform: ios }      # device + simulators
          - { name: android,           os: ubuntu-latest,    platform: android }  # arm64-v8a + x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install cibuildwheel
        run: python -m pip install "cibuildwheel>=4.3,<5"
      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse --platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.name }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  pure:
    name: Pure-Python wheel and source archive
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build
        run: |
          python -m pip install build
          python -m build --sdist --outdir dist
          NO_CYTHON=1 python -m build --wheel --outdir dist
      - name: Check the pure-Python wheel
        run: |
          python -m pip install dist/*-py3-none-any.whl
          cd tools && python check_wheel.py --pure
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-pure-sdist
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release v${{ needs.version.outputs.version }}
    needs: [ version, wheels, pure ]
    # runs even when a wheel job failed (!cancelled), never for pull requests
    if: >-
      ${{ !cancelled() && needs.version.result == 'success' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release)) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # two runs releasing the same version (a push and its tag) publish one after the other
    concurrency:
      group: release-v${{ needs.version.outputs.version }}
      cancel-in-progress: false
    env:
      TAG: v${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Checksums and notes
        env:
          WHEELS_RESULT: ${{ needs.wheels.result }}
          PURE_RESULT: ${{ needs.pure.result }}
        run: |
          if [ -z "$(ls -A dist 2>/dev/null)" ]; then
            echo "::error::no build produced any file: nothing to publish"
            exit 1
          fi
          cd dist
          sha256sum -- * > SHA256SUMS.txt
          ls -l
          cd ..
          {
            echo "## RdpyManyQt $TAG"
            echo
            if [ "$WHEELS_RESULT" != "success" ] || [ "$PURE_RESULT" != "success" ]; then
              echo "> **Note:** some platforms failed to build in [this run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID): their wheels are missing from this release."
              echo
            fi
            echo "Install the wheel matching your system and Python (cp311 = Python 3.11 ...):"
            echo
            echo '```'
            echo "pip install rdpymanyqt-${TAG#v}-<python>-<platform>.whl"
            echo '```'
            echo
            echo "- \`*-py3-none-any.whl\`: pure Python, any platform (slower decoders)."
            echo "- iOS / Android wheels are libraries for app packagers (Briefcase, pyside6-android-deploy...)."
            echo "- Verify downloads with \`SHA256SUMS.txt\`."
            echo
            echo "See CHANGELOG.md for the changes."
          } > notes.md
          if [ "$WHEELS_RESULT" != "success" ] || [ "$PURE_RESULT" != "success" ]; then
            echo "::warning::publishing $TAG without the wheels of the failed platform builds"
          fi
      - name: Force-push tag ${{ env.TAG }} to this commit
        run: |
          # commit the remote tag points to (the peeled ^{} line of an annotated tag comes last)
          current=$(git ls-remote --tags origin | awk -v t="refs/tags/$TAG" '$2 == t || $2 == t "^{}" { sha = $1 } END { print sha }')
          if [ "$current" = "$GITHUB_SHA" ]; then
            echo "$TAG already points to $GITHUB_SHA"
            exit 0
          fi
          echo "moving $TAG from ${current:-<none>} to $GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --force --annotate "$TAG" --message "RdpyManyQt $TAG" "$GITHUB_SHA"
          # (a tag pushed with GITHUB_TOKEN does not start another workflow run)
          git push --force origin "refs/tags/$TAG"
      - name: Publish release ${{ env.TAG }} (create or replace)
        run: |
          # GitHub's generated changelog, appended to the notes (not fatal if unavailable)
          if gh api "repos/$GH_REPO/releases/generate-notes" -f tag_name="$TAG" \
               -f target_commitish="$GITHUB_SHA" --jq .body > generated.md 2>/dev/null; then
            { echo; cat generated.md; } >> notes.md
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file notes.md --draft=false
            gh release upload "$TAG" dist/* --clobber
            # drop assets of an earlier build that this build did not produce, so the
            # release matches the tagged commit
            gh release view "$TAG" --json assets --jq '.assets[].name' | while IFS= read -r asset; do
              if [ ! -e "dist/$asset" ]; then
                echo "removing stale asset $asset"
                gh release delete-asset "$TAG" "$asset" --yes
              fi
            done
          else
            gh release create "$TAG" dist/* --title "$TAG" --notes-file notes.md --verify-tag
          fi
